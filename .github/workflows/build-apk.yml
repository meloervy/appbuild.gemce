name: Build & Package Gemce APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Gemce APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Installable APK
        run: ./gradlew assembleDebug

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-artifacts
          VERSION_NAME="${{ github.ref_name }}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "main" ]; then
            VERSION_NAME="latest"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Gemce-${VERSION_NAME}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemce-APK
          path: release-artifacts/*.apk

      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: Gemce ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
